# Codemagic CI — builds the DA OPS Capacitor app for iOS in the cloud (no Mac
# needed on your side) and ships it to TestFlight.
#
# ONE-TIME SETUP (after your Apple Developer Program is approved):
#   1. Put this repo on GitHub/GitLab/Bitbucket and connect it in Codemagic.
#   2. Apple → App Store Connect → Users and Access → Integrations → App Store
#      Connect API → generate an API key (Admin/App Manager). Download the .p8.
#   3. In Codemagic → Team settings → Integrations → App Store Connect → add that
#      key. Name the integration exactly:  DA_OPS_ASC
#   4. In App Store Connect → Apps → create the app record (bundle id below);
#      copy its numeric "Apple ID" into APP_STORE_APP_ID.
#   5. Start the `ios-testflight` workflow. First build ~15-20 min → TestFlight.
#
# You install it on your iPhone via Apple's free "TestFlight" app.

workflows:
  ios-testflight:
    name: DA OPS iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: DA_OPS_ASC
    environment:
      vars:
        VITE_API_BASE: "https://fuel.dasuperapp.com"
        BUNDLE_ID: "zw.co.damotors.fuel"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6803099237   # DA OPS app record (App Store Connect)
      groups:
        - signing          # holds CERTIFICATE_PRIVATE_KEY (added securely in Codemagic UI)
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Build the web UI (Vite)
        script: npm run build
      - name: Add & sync the iOS native project
        script: |
          npm install @capacitor/ios
          # Capacitor 8 defaults new iOS projects to Swift Package Manager, but our
          # biometric-auth plugin ships only a CocoaPods podspec — so force CocoaPods.
          [ -d ios ] || npx cap add ios --packagemanager Cocoapods
          npx cap sync ios
          # Apply the DA app icon. Capacitor 8's default iconset is a single 1024px image
          # (AppIcon-512@2x.png); replacing it puts the DA cheetah on the home screen.
          cp assets/icon.png "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
      - name: Configure Info.plist (display name, permission strings, encryption)
        # The default Capacitor Info.plist has no usage-description strings. The app links
        # Camera, Location, Face ID and Notifications through its plugins, and Apple REJECTS
        # (during App Store processing, ITMS-90683) any binary that uses those frameworks
        # without a purpose string. Inject them here (ios/ is regenerated fresh each build).
        # ITSAppUsesNonExemptEncryption=false = standard HTTPS only, skips the TestFlight
        # export-compliance prompt.
        script: |
          cd ios/App
          PL="App/Info.plist"
          put() { /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PL"; }
          put CFBundleDisplayName string "DA OPS"
          # Every TestFlight upload needs a unique, increasing build number. Codemagic's
          # $BUILD_NUMBER auto-increments per build, so uploads never collide (fallback 1).
          put CFBundleVersion string "${BUILD_NUMBER:-1}"
          # Keep the MARKETING version STABLE ("1.0") on purpose: external TestFlight
          # needs Beta App Review only when the version STRING changes. Fixing it means
          # one review, then every later build (new build NUMBER, same version) reaches
          # external testers automatically. The real app version shows in-app (APP_BUILD).
          put CFBundleShortVersionString string "1.0"
          put NSCameraUsageDescription string "DA OPS uses the camera to photograph the fuel tank and odometer for each request."
          put NSPhotoLibraryUsageDescription string "DA OPS attaches a photo of the fuel tank or odometer to a request."
          put NSPhotoLibraryAddUsageDescription string "DA OPS can save a captured fuel or odometer photo to your library."
          put NSLocationWhenInUseUsageDescription string "DA OPS confirms you are at the fuelling station when you raise a request."
          put NSLocationAlwaysAndWhenInUseUsageDescription string "DA OPS confirms you are at the fuelling station when you raise a request."
          put NSFaceIDUsageDescription string "DA OPS uses Face ID to sign you in securely."
          put ITSAppUsesNonExemptEncryption bool false
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set up code signing (certificate + profile)
        # Runs AFTER pod install (CocoaPods rewrites the project's build settings, so signing
        # must be applied last). A brand-new Apple account has no iOS Distribution certificate.
        # Handed a private key (CERTIFICATE_PRIVATE_KEY env var, set in Codemagic), this one
        # call creates the certificate AND the provisioning profile — and is idempotent, so
        # later builds reuse the same certificate (no Apple 2-cert-limit problem).
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # "DA Team" is an INTERNAL TestFlight group — internal groups receive each
        # processed build AUTOMATICALLY, and Apple rejects an explicit assignment
        # ("Cannot add internal group to a build"). So we do NOT list beta_groups:
        # submit_to_testflight alone puts the build on TestFlight and internal testers
        # get it. (If you later want EXTERNAL testers, make an external group in App
        # Store Connect and add it here — that triggers a one-time Beta App Review.)
